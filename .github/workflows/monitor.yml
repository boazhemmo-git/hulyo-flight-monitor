# GitHub's own `schedule` trigger turned out unreliable for a 5-min interval
# on this repo (after registering, it settled into firing every ~4h instead
# of every 5min -- a known, unresolved GitHub Actions limitation on
# sub-hourly schedules for low-traffic repos, not something fixable here).
# An external scheduler (cron-job.org) now calls the workflow_dispatch API
# on a real 5-minute clock instead.
name: Hulyo flight monitor

on:
  workflow_dispatch: {}

concurrency:
  group: hulyo-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run monitor cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hulyo_monitor.py

      - name: Persist monitor state
        run: |
          git add seen_deals.json telegram_offset.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update monitor state [skip ci]"
            git push
          fi
